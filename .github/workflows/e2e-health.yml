name: E2E Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-health:
    runs-on: ubuntu-latest

    # ✅ Inject secrets into environment
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for backend to become ready
        run: |
          set -e
          for i in $(seq 1 60); do
            echo "Attempt $i: checking backend readiness..."
            if curl -fsS http://localhost:8000/api/v1/health/ready > /dev/null; then
              echo "Backend is ready ✅"
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to become ready. Dumping logs:"
          docker compose logs --no-color
          exit 1

      - name: Hit health endpoints
        run: |
          echo "Health:"
          curl -fsS http://localhost:8000/api/v1/health/health || true
          echo "Ready:"
          curl -fsS http://localhost:8000/api/v1/health/ready || true

      - name: Teardown
        if: always()
        run: docker compose down --volumes --remove-orphans
