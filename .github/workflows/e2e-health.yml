name: E2E Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start services
        run: |
          docker compose up -d --build

      - name: Wait for backend to become healthy
        run: |
          set -e
          for i in $(seq 1 60); do
            echo "Attempt $i: checking backend health..."
            if curl -sS http://localhost:8000/api/v1/health/health -o /dev/null; then
              echo "backend is up"
              break
            fi
            sleep 2
          done
          if ! curl -sS http://localhost:8000/api/v1/health/health -f -o /dev/null; then
            echo "Backend failed to respond. Dumping logs:" >&2
            docker compose logs --no-color
            exit 1
          fi

      - name: Hit health endpoints
        run: |
          set -e
          echo "Health:"
          curl -fsS http://localhost:8000/api/v1/health/health | jq || true
          echo "Ready:"
          curl -fsS http://localhost:8000/api/v1/health/ready | jq || true

      - name: Teardown
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
